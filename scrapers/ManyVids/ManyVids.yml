name: ManyVids
performerByName:
  action: scrapeJson
  queryURL: https://www.manyvids.com/bff/search/autocomplete?keywords={}&contentPref=0
  scraper: performerSearch
performerByURL:
  - action: scrapeJson
    url:
      - manyvids.com/Profile
    scraper: performerScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .*/Profile/(\d+)/.*
          with: https://api.manyvids.com/profile/profile/$1
sceneByName:
  action: scrapeJson
  queryURL: https://www.manyvids.com/bff/search/results?keywords={}&contentPref=0
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeJson
  scraper: sceneScraper
  queryURL: "{url}"
  queryURLReplace:
    url:
      - regex: ^(https:\/\/www\.manyvids\.com\/Video\/)
        with: https://api.manyvids.com/store/video/
      - regex: /[^/]*/*$
        with: ""
sceneByFragment:
  action: scrapeJson
  scraper: sceneScraper
  queryURL: "https://api.manyvids.com/store/video/{filename}"
  queryURLReplace:
    filename:
      - regex: .*?(\d{6,8}).*
        with: $1
sceneByURL:
  - action: scrapeJson
    url:
      - manyvids.com/Video/
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .*?(\d+).*
          with: https://api.manyvids.com/store/video/$1
jsonScrapers:
  performerSearch:
    performer:
      Name: models.#.username
      URLs:
        selector: models.#.url
        postProcess:
          - replace:
              - regex: ^
                with: https://www.manyvids.com
      Image: models.#.avatar.url
  performerScraper:
    performer:
      Name: displayName
      Aliases: 
        selector: urlHandle
        replace:
            - regex: "-"
              with: ""
      Gender: identification
      URLs:
        selector: '{"id":legacyUserId,"handle":urlHandle,"insta":socLinkInstagram,"tw":socLinkTwitter,"yt":socLinkYoutube}'
        postProcess:
          - javascript: |
              const { id, handle, insta, tw, yt } = JSON.parse(value || "{}");
              const usernameFrom = (raw, kind) => {
                if (!raw) return "";
                const original = String(raw);
                let s = original
                  .trim()
                  .toLowerCase()
                  .replace(/^https?:\/\//i, "")
                  .replace(/^www\./i, "")
                  .replace(/\/+$/, "");
                if (!s) return "";

                if (kind === "x") {
                  const screenName = (original.match(/[?&]screen_name=([a-z0-9_]+)/i) || [])[1];
                  if (screenName) return screenName.toLowerCase();
                }

                const slash = s.indexOf("/");
                if (slash > -1 && s.slice(0, slash).includes(".")) {
                  s = s.slice(slash + 1);
                }

                s = s.split("?")[0].split("#")[0].replace(/^\/+/, "");
                if (!s) return "";

                if (s.startsWith("user/")) s = s.slice(5);
                if (s.startsWith("channel/")) s = s.slice(8);
                if (s.startsWith("c/")) s = s.slice(2);

                if (kind === "x") {
                  s = s.replace(/^(twitter\.com|x\.com)\//, "");
                }

                const part = s.split("/").find(Boolean) || "";
                return part.replace(/^@/, "");
              };

              const canonical = (raw, kind) => {
                const username = usernameFrom(raw, kind);
                if (!username) return "";
                if (kind === "x") return `https://x.com/${username}`;
                if (kind === "instagram") return `https://www.instagram.com/${username}`;
                if (kind === "youtube") return `https://youtube.com/${username}`;
                return "";
              };

              const urls = [
                id && handle ? `https://www.manyvids.com/Profile/${id}/${handle}/Store/Videos` : "",
                canonical(insta, "instagram"),
                canonical(tw, "x"),
                canonical(yt, "youtube"),
              ];
              return urls
                .filter(Boolean)
                .map((u) => u.toLowerCase())
                .join("\n");
        split: "\n"
      Birthdate:
        selector: dob
        postProcess:
          - parseDate: 2006-01-02T15:04:05.000Z
      Ethnicity:
        selector: ethnicity
        postProcess:
          - map:
              "White / Caucasian": "Caucasian"
              "Black / Ebony": "Black"
              "Latino / Hispanic": "Latin"
              "Choose": ""
      Country: location
      HairColor: 
        selector: hairColor
        postProcess:
          - map:
              "Dark Blonde": "Blonde"
              "Dark Brown": "Brunette"
              "Brown": "Brunette"
              "Redhead": "Red"
              "Platinum Blonde": "Blonde"
              "Choose": ""
      CareerLength:
        selector: createdAt
        postProcess:
          - replace:
              - regex: '\-.*'
                with: ""
              - regex: "$"
                with: " - Present"
      Image: 
        selector: "[portrait,avatar]"
      Details: 
        selector: description
        postProcess:
          - javascript: |
              return String(value || "")
                .replace(/\r/g, "")
                .replace(/\\(['"])/g, "$1")
                .replace(/<\/p>\s*<p>/g, "\n")
                .replace(/<br\s*\/?>/g, "\n")
                .replace(/<[^>]+>/g, "")
                .replace(/&amp;/g, "&")
                .replace(/&quot;/g, '"')
                .replace(/&#0?39;/g, "'")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .trim()
  sceneSearch:
    scene:
      Title: vids.#.title
      Code: vids.#.id
      URL:
        selector: "vids.#.{id,slug}.@values"
        postProcess:
          - replace:
              - regex: '\["(\d+)",\s*"([^"]+)"\]'
                with: $1/$2
              - regex: ^
                with: https://www.manyvids.com/Video/
      Image: vids.#.thumbnail.url
  sceneScraper:
    scene:
      Title:
        selector: data.title
        postProcess:
          - &decodeEntities
            javascript: |
              const entities = { "&amp;": "&", "&quot;": '"', "&lt;": "<", "&gt;": ">" };
              return String(value || "").replace(/&(?:amp|quot|lt|gt);/g, (e) => entities[e]);
      Details:
        selector: data.description
        postProcess:
          - *decodeEntities
      Code: data.id
      URL:
        selector: data.url
        postProcess:
          - replace:
              - regex: ^
                with: https://www.manyvids.com
      Date:
        selector: data.launchDate
        postProcess:
          - parseDate: 2006-01-02T15:04:05.000Z
      Image: data.screenshot
      Tags:
        Name: data.tagList.#.label
      Performers:
        Name: 
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: .+Profile\/\d+\/(.+)\/Store.+
                  with: $1
        URLs:
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: ^
                  with: https://www.manyvids.com
      Studio:
        Name: 
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: .+Profile\/\d+\/(.+)\/Store.+
                  with: "$1 (ManyVids)"
        URL:
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: ^
                  with: https://www.manyvids.com
